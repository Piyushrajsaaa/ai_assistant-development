{% extends "base.html" %} {% block title %}Text Summarization{% endblock %} {%
block content %}
<div class="page-container">
  <div class="page-header">
    <h2>📄 Text Summarization</h2>
    <p>Paste any text and get a clear, structured summary.</p>
  </div>

  <div class="form-card">
    <div class="form-group">
      <label>Text to Summarize</label>
      <textarea
        id="textInput"
        placeholder="Paste your paragraph, article, or document here..."
      ></textarea>
    </div>

    <div class="form-group">
      <label>Summary Style</label>
      <div class="style-selector">
        <button class="style-btn" data-style="quick">⚡ Quick</button>
        <button class="style-btn selected" data-style="bullet">
          📋 Bullet Points
        </button>
        <button class="style-btn" data-style="academic">🎓 Academic</button>
      </div>
      <input type="hidden" id="selectedStyle" value="bullet" />
    </div>

    <button class="btn-submit" id="submitBtn" onclick="handleSummarize()">
      <div class="spinner" id="spinner"></div>
      <span id="btnText">Summarize</span>
    </button>
  </div>

  <div class="response-card" id="responseCard">
    <div class="response-header">
      <h4>Summary</h4>
      <span class="badge">AI Generated</span>
    </div>
    <div class="response-text" id="responseText"></div>
  </div>

  <div class="feedback-section" id="feedbackSection">
    <p>Was this response helpful?</p>
    <div class="feedback-buttons">
      <button
        class="btn-feedback btn-yes"
        onclick="
          sendFeedback(
            '/summarize/feedback',
            window._lastInput,
            window._lastResponse,
            true,
          )
        "
      >
        👍 Yes
      </button>
      <button
        class="btn-feedback btn-no"
        onclick="
          sendFeedback(
            '/summarize/feedback',
            window._lastInput,
            window._lastResponse,
            false,
          )
        "
      >
        👎 No
      </button>
    </div>
    <span class="feedback-thanks" id="feedbackThanks">
      ✅ Thank you for your feedback!
    </span>
  </div>
</div>
{% endblock %}
