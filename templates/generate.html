{% extends "base.html" %} {% block title %}Content Generation{% endblock %} {%
block content %}
<div class="page-container">
  <div class="page-header">
    <h2>✍️ Content Generation</h2>
    <p>Generate creative stories, poems, essays, and ideas.</p>
  </div>

  <div class="form-card">
    <div class="form-group">
      <label>Topic or Theme</label>
      <input
        type="text"
        id="topicInput"
        placeholder="e.g. A robot learning to paint, Autumn in a city..."
      />
    </div>

    <div class="form-group">
      <label>Content Type</label>
      <select id="contentType">
        <option value="story">📖 Story</option>
        <option value="poem">🎭 Poem</option>
        <option value="essay">📝 Essay</option>
        <option value="idea">💡 Creative Idea</option>
      </select>
    </div>

    <div class="form-group">
      <label>Writing Style</label>
      <div class="style-selector">
        <button class="style-btn" data-style="simple">✨ Simple</button>
        <button class="style-btn selected" data-style="detailed">
          🎨 Detailed
        </button>
        <button class="style-btn" data-style="structured">📐 Structured</button>
      </div>
      <input type="hidden" id="selectedStyle" value="detailed" />
    </div>

    <button class="btn-submit" id="submitBtn" onclick="handleGenerate()">
      <div class="spinner" id="spinner"></div>
      <span id="btnText">Generate</span>
    </button>
  </div>

  <div class="response-card" id="responseCard">
    <div class="response-header">
      <h4>Generated Content</h4>
      <span class="badge">AI Created</span>
    </div>
    <div class="response-text" id="responseText"></div>
  </div>

  <div class="feedback-section" id="feedbackSection">
    <p>Was this response helpful?</p>
    <div class="feedback-buttons">
      <button
        class="btn-feedback btn-yes"
        onclick="
          sendFeedback(
            '/generate/feedback',
            window._lastInput,
            window._lastResponse,
            true,
          )
        "
      >
        👍 Yes
      </button>
      <button
        class="btn-feedback btn-no"
        onclick="
          sendFeedback(
            '/generate/feedback',
            window._lastInput,
            window._lastResponse,
            false,
          )
        "
      >
        👎 No
      </button>
    </div>
    <span class="feedback-thanks" id="feedbackThanks">
      ✅ Thank you for your feedback!
    </span>
  </div>
</div>
{% endblock %}
