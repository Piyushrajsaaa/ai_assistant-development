{% extends "base.html" %} {% block title %}Study Advisor{% endblock %} {% block
content %}
<div class="page-container">
  <div class="page-header">
    <h2>🎓 Study Advisor</h2>
    <p>Get personalized study plans, roadmaps, and learning resources.</p>
  </div>

  <div class="form-card">
    <div class="form-group">
      <label>What do you want to learn?</label>
      <input
        type="text"
        id="queryInput"
        placeholder="e.g. How to prepare for DSA interviews, Learn Machine Learning..."
      />
    </div>

    <div class="form-group">
      <label>Advice Style</label>
      <div class="style-selector">
        <button class="style-btn" data-style="quick">⚡ Quick Tips</button>
        <button class="style-btn selected" data-style="roadmap">
          🗺️ Roadmap
        </button>
        <button class="style-btn" data-style="expert">🏆 Expert Plan</button>
      </div>
      <input type="hidden" id="selectedStyle" value="roadmap" />
    </div>

    <button class="btn-submit" id="submitBtn" onclick="handleAdvisor()">
      <div class="spinner" id="spinner"></div>
      <span id="btnText">Get Advice</span>
    </button>
  </div>

  <div class="response-card" id="responseCard">
    <div class="response-header">
      <h4>Study Plan</h4>
      <span class="badge">Personalized</span>
    </div>
    <div class="response-text" id="responseText"></div>
  </div>

  <div class="feedback-section" id="feedbackSection">
    <p>Was this response helpful?</p>
    <div class="feedback-buttons">
      <button
        class="btn-feedback btn-yes"
        onclick="
          sendFeedback(
            '/advisor/feedback',
            window._lastInput,
            window._lastResponse,
            true,
          )
        "
      >
        👍 Yes
      </button>
      <button
        class="btn-feedback btn-no"
        onclick="
          sendFeedback(
            '/advisor/feedback',
            window._lastInput,
            window._lastResponse,
            false,
          )
        "
      >
        👎 No
      </button>
    </div>
    <span class="feedback-thanks" id="feedbackThanks">
      ✅ Thank you for your feedback!
    </span>
  </div>
</div>
{% endblock %}
