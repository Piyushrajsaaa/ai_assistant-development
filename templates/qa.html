{% extends "base.html" %} {% block title %}Question Answering{% endblock %} {%
block content %}
<div class="page-container">
  <!-- Page Header -->
  <div class="page-header">
    <h2>💬 Question Answering</h2>
    <p>Ask any question and receive a clear, accurate answer.</p>
  </div>

  <!-- Input Form -->
  <div class="form-card">
    <div class="form-group">
      <label>Your Question</label>
      <input
        type="text"
        id="questionInput"
        placeholder="e.g. What is machine learning? Explain OOP concepts."
      />
    </div>

    <div class="form-group">
      <label>Response Style</label>
      <div class="style-selector">
        <button class="style-btn" data-style="simple">⚡ Simple</button>
        <button class="style-btn selected" data-style="educational">
          📚 Educational
        </button>
        <button class="style-btn" data-style="detailed">🔬 Detailed</button>
      </div>
      <!-- Hidden input stores selected style -->
      <input type="hidden" id="selectedStyle" value="educational" />
    </div>

    <button class="btn-submit" id="submitBtn" onclick="handleQA()">
      <div class="spinner" id="spinner"></div>
      <span id="btnText">Get Answer</span>
    </button>
  </div>

  <!-- Response Card (hidden until response arrives) -->
  <div class="response-card" id="responseCard">
    <div class="response-header">
      <h4>AI Response</h4>
      <span class="badge" id="styleBadge">Educational</span>
    </div>
    <div class="response-text" id="responseText"></div>
  </div>

  <!-- Feedback Section -->
  <div class="feedback-section" id="feedbackSection">
    <p>Was this response helpful?</p>
    <div class="feedback-buttons">
      <button
        class="btn-feedback btn-yes"
        onclick="
          sendFeedback(
            '/qa/feedback',
            window._lastInput,
            window._lastResponse,
            true,
          )
        "
      >
        👍 Yes
      </button>
      <button
        class="btn-feedback btn-no"
        onclick="
          sendFeedback(
            '/qa/feedback',
            window._lastInput,
            window._lastResponse,
            false,
          )
        "
      >
        👎 No
      </button>
    </div>
    <span class="feedback-thanks" id="feedbackThanks">
      ✅ Thank you for your feedback!
    </span>
  </div>
</div>
{% endblock %}
