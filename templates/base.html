<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}AI Assistant{% endblock %}</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>
  <body>
    <nav class="navbar">
      <a href="/" class="navbar-brand">🤖 <span>AI Assistant</span></a>
      <ul class="navbar-links">
        <li>
          <a href="/" class="{{ 'active' if request.path == '/' else '' }}">
            Home
          </a>
        </li>
        <li>
          <a href="/qa" class="{{ 'active' if request.path == '/qa' else '' }}">
            Q&amp;A
          </a>
        </li>
        <li>
          <a
            href="/summarize"
            class="{{ 'active' if request.path == '/summarize' else '' }}"
          >
            Summarize
          </a>
        </li>
        <li>
          <a
            href="/generate"
            class="{{ 'active' if request.path == '/generate' else '' }}"
          >
            Generate
          </a>
        </li>
        <li>
          <a
            href="/advisor"
            class="{{ 'active' if request.path == '/advisor' else '' }}"
          >
            Advisor
          </a>
        </li>
      </ul>
    </nav>

    {% block content %}{% endblock %}

    <footer>
      <p>
        🤖 AI Assistant &mdash; Built with Flask &amp; Gemini API &mdash; Prompt
        Engineering Project
      </p>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block extra_js %}{% endblock %}
  </body>
</html>
